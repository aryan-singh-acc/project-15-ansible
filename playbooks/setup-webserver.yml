---
- name: Configure Apache Web Server
  hosts: webservers
  become: yes

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache web server
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Start and enable Apache service
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes

    - name: Deploy custom website
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Project 15 - Ansible Automation</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background: #101827;
                      color: white;
                      text-align: center;
                      padding: 100px 20px;
                  }
                  .card {
                      background: #1c293b;
                      padding: 40px;
                      border-radius: 12px;
                      display: inline-block;
                  }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>Apache Web Server Running!</h1>
                  <h2>Project 15 - Ansible Automation</h2>
                  <p>Successfully configured using an Ansible Playbook.</p>
                  <p>Status: Operational</p>
                  <p>Automated by Aryan Singh</p>
              </div>
          </body>
          </html>
        owner: root
        group: root
        mode: '0644'
